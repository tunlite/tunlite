name: Legacy Node 0.10.3 verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: archived node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Hard cap so a hung test can never run to GitHub's 6-hour default.
    # (`node --test` has no default per-test timeout, so a test that waits on
    # something that never resolves would hang forever.) The full 405-case
    # suite finishes in well under a minute.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      # This workflow verifies the frozen release, not the Go v1 working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.10.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # tunlite has zero runtime dependencies — nothing to install.
      # Tests sandbox themselves (fake ssh via TUNLITE_SSH, autostart via
      # TUNLITE_FAKE_AUTOSTART) and never touch the real system.
      - name: Run tests
        run: node --test

name: Go Release

on:
  push:
    tags:
      - 'v1.0.0-preview.*'
      - 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, package, and attest
    # Universal 2 packaging uses Apple's lipo after cross-compiling both slices.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep releases on one reviewed toolchain even though go.mod accepts
          # the previous supported Go line for contributors.
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

      - name: Package tagged version
        run: scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Verify release artifacts
        run: scripts/verify-release.sh "${GITHUB_REF_NAME}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

      - name: Preserve release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download attested artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish preview Release
        if: contains(github.ref_name, '-preview.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --generate-notes --title "Tunlite ${GITHUB_REF_NAME}"

      - name: Publish stable Release
        if: ${{ !contains(github.ref_name, '-preview.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Tunlite ${GITHUB_REF_NAME}"

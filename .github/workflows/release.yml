name: Go Release

on:
  push:
    tags:
      - 'v1.0.0-preview.*'
      - 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A tag is not allowed to rely on the result of a separate push workflow: the
# release run owns every gate that can prevent publication.
permissions:
  contents: read

jobs:
  test:
    name: Go test and vet · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./...

  minimum-go:
    name: Minimum Go 1.25
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...

  quality:
    name: Modules, static analysis, and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  openssh:
    name: Real OpenSSH forwarding
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Exercise local, remote, and SOCKS forwarding through an isolated sshd
        env:
          TUNLITE_REAL_SSH: '1'
        run: go test ./internal/cli -run '^TestRealOpenSSHAllForwardTypes$' -count=1 -v

  build:
    name: Package, native E2E, and attest
    needs: [test, race, minimum-go, quality, openssh]
    # Universal 2 packaging uses Apple's lipo. The release E2E then runs a
    # packaged binary through isolated sshd and a real launchd user job.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep releases on one reviewed toolchain even though go.mod accepts
          # the previous supported Go line for contributors.
          go-version: '1.26.x'
          cache: true

      - name: Package tagged version
        run: scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Verify release artifacts
        run: scripts/verify-release.sh "${GITHUB_REF_NAME}"
      - name: Test packaged binary with real OpenSSH and launchd
        # Passing dist is intentional: the E2E must run the exact archive that
        # the following steps attest, upload, and publish.
        run: scripts/test-release-e2e.sh "${GITHUB_REF_NAME}" dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

      - name: Preserve release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download gated, attested artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish preview Release
        if: contains(github.ref_name, '-preview.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --generate-notes --title "Tunlite ${GITHUB_REF_NAME}"

      - name: Publish stable Release
        if: ${{ !contains(github.ref_name, '-preview.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Tunlite ${GITHUB_REF_NAME}"

name: Bug report
description: Report a problem with tunlite
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please fill out the details below so we can
        reproduce it. **Redact any real hostnames, IPs, and secrets.**
  - type: input
    id: version
    attributes:
      label: tunlite version
      description: Output of `tunlite version --json`
      placeholder: 'v1.0.0-preview.1'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Runtime capabilities
      description: Output of `tunlite capabilities --json`; redact paths or identifiers if needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      placeholder: |
        1. tunlite add web --to user@host -L 8080:localhost:80
        2. tunlite start web
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error output. Re-run with `--json` if possible.
    validations:
      required: true
